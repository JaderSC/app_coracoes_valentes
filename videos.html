    <!-- Script de Interatividade -->
    <script>
        const inner = document.getElementById('carousel-inner');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const dots = document.querySelectorAll('.dot');

        let currentIndex = 0;
        const totalSlides = dots.length;
        const intervalTime = 4000; // Tempo de transição automática (4 segundos)
        let slideInterval;

        // Atualiza o posicionamento visual do carrossel
        function updateCarousel() {
            // Move o wrapper horizontalmente com base no index atual
            inner.style.transform = `translateX(-${currentIndex * 100}%)`;

            // Atualiza os pontinhos indicadores
            dots.forEach((dot, index) => {
                if (index === currentIndex) {
                    dot.classList.remove('bg-white/50');
                    dot.classList.add('bg-white', 'w-6'); // Deixa o ponto ativo maior e mais visível
                } else {
                    dot.classList.remove('bg-white', 'w-6');
                    dot.classList.add('bg-white/50');
                }
            });
        }

        function nextSlide() {
            currentIndex = (currentIndex + 1) % totalSlides;
            updateCarousel();
        }

        function prevSlide() {
            currentIndex = (currentIndex - 1 + totalSlides) % totalSlides;
            updateCarousel();
        }

        // Inicia e reinicia o temporizador automático
        function startAutoSlide() {
            clearInterval(slideInterval);
            slideInterval = setInterval(nextSlide, intervalTime);
        }

        // Eventos dos botões
        nextBtn.addEventListener('click', () => {
            nextSlide();
            startAutoSlide(); // Reinicia o tempo para não pular logo em seguida
        });

        prevBtn.addEventListener('click', () => {
            prevSlide();
            startAutoSlide();
        });

        // Eventos nos pontinhos indicadores
        dots.forEach(dot => {
            dot.addEventListener('click', (e) => {
                currentIndex = parseInt(e.target.dataset.slide);
                updateCarousel();
                startAutoSlide();
            });
        });

        // Suporte a gestos Touch (Swipe) para Mobile
        let startX = 0;
        inner.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            clearInterval(slideInterval); // Pausa ao tocar
        });

        inner.addEventListener('touchend', (e) => {
            const endX = e.changedTouches[0].clientX;
            const diffX = startX - endX;

            if (diffX > 50) {
                nextSlide(); // Deslizou para a esquerda
            } else if (diffX < -50) {
                prevSlide(); // Deslizou para a direita
            }
            startAutoSlide(); // Retoma o automático
        });

        // Inicialização do Carrossel
        updateCarousel();
        startAutoSlide();
    </script>

    <!-- JAVASCRIPT INTERATIVO -->
    <script>
        const menuBtn = document.getElementById('menu-btn');
        const closeBtn = document.getElementById('close-btn');
        const sidebar = document.getElementById('sidebar');
        const backdrop = document.getElementById('sidebar-backdrop');

        function openMenu() {
            // Exibe o backdrop tirando o 'hidden' e aplicando opacidade com delay
            backdrop.classList.remove('hidden');
            setTimeout(() => backdrop.classList.remove('opacity-0'), 10);

            // Move a sidebar para dentro da tela
            sidebar.classList.remove('translate-x-full');

            // Evita scroll no fundo enquanto o menu está aberto
            document.body.classList.add('overflow-hidden');
        }

        function closeMenu() {
            // Esconde o backdrop com transição suave
            backdrop.classList.add('opacity-0');
            setTimeout(() => backdrop.classList.add('hidden'), 300);

            // Move a sidebar para fora da tela
            sidebar.classList.add('translate-x-full');

            // Restaura o scroll da página
            document.body.classList.remove('overflow-hidden');
        }

        // Eventos
        menuBtn.addEventListener('click', openMenu);
        closeBtn.addEventListener('click', closeMenu);
        backdrop.addEventListener('click', closeMenu); // Fecha ao clicar fora do menu
    </script>

<!DOCTYPE html>
<html lang="pt-BR" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fraternidade Corações Valentes</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="shortcut icon" href="./img/logo.png" type="image/x-icon">
</head>

<body class="flex flex-col h-full bg-gray-50 text-gray-800 antialiased overflow-x-hidden">


    <!-- NAVBAR -->
    <nav class="bg-blue-700 border-b border-gray-200 fixed top-0 w-full z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo -->
                <div class="flex-shrink-0 font-bold text-xl text-indigo-100">
                    <img src="./img/logo.png" alt="Logo do Site" class="h-20 w-auto">
                </div>

                <!-- Menu Desktop -->
                <div class="hidden md:flex space-x-8 font-medium">


                    <a href="/index.html" class="text-gray-100 hover:text-indigo-200 transition">Início</a>
                    <a href="/videos.html" class="text-gray-100 hover:text-indigo-200 transition">Nossas Atividades</a>
                    <a href="/endereco.html" class="text-gray-100 hover:text-indigo-200 transition">Endereço</a>
                    <a href="/sobre_nos.html" class="text-gray-100 hover:text-indigo-200 transition">Sobre Nós</a>
                </div>

                <!-- Botão Hamburger Mobile -->
                <div class="md:hidden">
                    <button id="menu-btn" class="text-gray-100 hover:text-indigo-600 focus:outline-none p-2"
                        aria-label="Abrir menu">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- MENU MOBILE LATERAL (Sidebar com Blur) -->
    <!-- Backdrop (Fundo escurecido) -->
    <div id="sidebar-backdrop"
        class="fixed inset-0 bg-black/40 backdrop-blur-sm z-40 hidden opacity-0 transition-opacity duration-300"></div>

    <!-- Painel Lateral -->
    <aside id="sidebar"
        class="fixed top-0 right-0 bottom-0 w-64 bg-white/90 backdrop-blur-md z-50 transform translate-x-full transition-transform duration-300 ease-in-out border-l border-gray-200 p-6 flex flex-col">
        <!-- Botão Fechar -->
        <div class="flex justify-end mb-8">
            <button id="close-btn" class="text-gray-600 hover:text-indigo-600 focus:outline-none p-2"
                aria-label="Fechar menu">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                    </path>
                </svg>
            </button>
        </div>
        <!-- Links Mobile -->
        <nav class="flex flex-col space-y-6 font-medium text-lg">
            <a href="/index.html" class="text-gray-600 hover:text-indigo-600 transition">Início</a>
            <a href="/videos.html" class="text-gray-600 hover:text-indigo-600 transition">Nossas Atividades</a>
            <a href="/endereco.html" class="text-gray-600 hover:text-indigo-600 transition">Endereço</a>
            <a href="/sobre_nos.html" class="text-gray-600 hover:text-indigo-600 transition">Sobre Nós</a>
        </nav>
    </aside>

    <!-- MAIN (Centralizado Horizontal e Vertical) -->
    <main class="flex-grow flex items-center justify-center pt-16 pb-12 px-4">

        <!-- Container Principal do Carrossel (Responsivo) -->
        <div
            class="relative w-full max-w-4xl mx-auto overflow-hidden rounded-2xl shadow-xl aspect-video md:aspect-[21/9]">

            <!-- Wrapper das Imagens -->
            <div id="carousel-inner" class="flex transition-transform duration-700 ease-in-out h-full w-full">
                <!-- Slide 1 -->
                <div class="min-w-full h-full relative">
                    <img src="./img/foto_coracoes_valentes.webp" alt="foto da fachada"
                        class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-black/30 flex items-center p-6 md:p-12 text-white">

                    </div>
                </div>
                <!-- Slide 2 -->
                <div class="min-w-full h-full relative">
                    <img src="./img/logo.jpeg" alt="Logo" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-black/30 flex items-end p-6 md:p-12 text-white">

                    </div>
                </div>
                <!-- Slide 3 -->
                <div class="min-w-full h-full relative">
                    <img src="./img/foto_coracoes_valentes.webp" alt="Foto da fachada"
                        class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-black/30 flex items-end p-6 md:p-12 text-white">

                    </div>
                </div>
            </div>

            <!-- Botões de Navegação (Escondidos no Mobile, Visíveis no Desktop) -->
            <button id="prev-btn"
                class="hidden md:flex absolute top-1/2 left-4 -translate-y-1/2 bg-white/30 hover:bg-white/50 text-white p-3 rounded-full backdrop-blur-sm cursor-pointer transition">
                <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"
                    class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
                </svg>
            </button>
            <button id="next-btn"
                class="hidden md:flex absolute top-1/2 right-4 -translate-y-1/2 bg-white/30 hover:bg-white/50 text-white p-3 rounded-full backdrop-blur-sm cursor-pointer transition">
                <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"
                    class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
                </svg>
            </button>

            <!-- Indicadores/Pontinhos (Interativos e Responsivos) -->
            <div class="absolute bottom-4 left-1/2 -translate-x-1/2 flex space-x-2">
                <button class="dot w-3 h-3 rounded-full bg-white/50 hover:bg-white transition cursor-pointer"
                    data-slide="0"></button>
                <button class="dot w-3 h-3 rounded-full bg-white/50 hover:bg-white transition cursor-pointer"
                    data-slide="1"></button>
                <button class="dot w-3 h-3 rounded-full bg-white/50 hover:bg-white transition cursor-pointer"
                    data-slide="2"></button>
            </div>
        </div>

       


    </main>

    <!-- Script de Interatividade -->
    <script>
        const inner = document.getElementById('carousel-inner');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const dots = document.querySelectorAll('.dot');

        let currentIndex = 0;
        const totalSlides = dots.length;
        const intervalTime = 4000; // Tempo de transição automática (4 segundos)
        let slideInterval;

        // Atualiza o posicionamento visual do carrossel
        function updateCarousel() {
            // Move o wrapper horizontalmente com base no index atual
            inner.style.transform = `translateX(-${currentIndex * 100}%)`;

            // Atualiza os pontinhos indicadores
            dots.forEach((dot, index) => {
                if (index === currentIndex) {
                    dot.classList.remove('bg-white/50');
                    dot.classList.add('bg-white', 'w-6'); // Deixa o ponto ativo maior e mais visível
                } else {
                    dot.classList.remove('bg-white', 'w-6');
                    dot.classList.add('bg-white/50');
                }
            });
        }

        function nextSlide() {
            currentIndex = (currentIndex + 1) % totalSlides;
            updateCarousel();
        }

        function prevSlide() {
            currentIndex = (currentIndex - 1 + totalSlides) % totalSlides;
            updateCarousel();
        }

        // Inicia e reinicia o temporizador automático
        function startAutoSlide() {
            clearInterval(slideInterval);
            slideInterval = setInterval(nextSlide, intervalTime);
        }

        // Eventos dos botões
        nextBtn.addEventListener('click', () => {
            nextSlide();
            startAutoSlide(); // Reinicia o tempo para não pular logo em seguida
        });

        prevBtn.addEventListener('click', () => {
            prevSlide();
            startAutoSlide();
        });

        // Eventos nos pontinhos indicadores
        dots.forEach(dot => {
            dot.addEventListener('click', (e) => {
                currentIndex = parseInt(e.target.dataset.slide);
                updateCarousel();
                startAutoSlide();
            });
        });

        // Suporte a gestos Touch (Swipe) para Mobile
        let startX = 0;
        inner.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            clearInterval(slideInterval); // Pausa ao tocar
        });

        inner.addEventListener('touchend', (e) => {
            const endX = e.changedTouches[0].clientX;
            const diffX = startX - endX;

            if (diffX > 50) {
                nextSlide(); // Deslizou para a esquerda
            } else if (diffX < -50) {
                prevSlide(); // Deslizou para a direita
            }
            startAutoSlide(); // Retoma o automático
        });

        // Inicialização do Carrossel
        updateCarousel();
        startAutoSlide();
    </script>



    <!-- FOOTER -->
    <footer class="bg-blue-700 border-t border-gray-200 py-6 text-center text-sm text-gray-100">
        <div class="max-w-7xl mx-auto px-4">
            <p>&copy; 2026 Fraternidade Corações Valentes. Todos os direitos reservados.</p>
        </div>
    </footer>

    <!-- JAVASCRIPT INTERATIVO -->
    <script>
        const menuBtn = document.getElementById('menu-btn');
        const closeBtn = document.getElementById('close-btn');
        const sidebar = document.getElementById('sidebar');
        const backdrop = document.getElementById('sidebar-backdrop');

        function openMenu() {
            // Exibe o backdrop tirando o 'hidden' e aplicando opacidade com delay
            backdrop.classList.remove('hidden');
            setTimeout(() => backdrop.classList.remove('opacity-0'), 10);

            // Move a sidebar para dentro da tela
            sidebar.classList.remove('translate-x-full');

            // Evita scroll no fundo enquanto o menu está aberto
            document.body.classList.add('overflow-hidden');
        }

        function closeMenu() {
            // Esconde o backdrop com transição suave
            backdrop.classList.add('opacity-0');
            setTimeout(() => backdrop.classList.add('hidden'), 300);

            // Move a sidebar para fora da tela
            sidebar.classList.add('translate-x-full');

            // Restaura o scroll da página
            document.body.classList.remove('overflow-hidden');
        }

        // Eventos
        menuBtn.addEventListener('click', openMenu);
        closeBtn.addEventListener('click', closeMenu);
        backdrop.addEventListener('click', closeMenu); // Fecha ao clicar fora do menu
    </script>
</body>

</html>
